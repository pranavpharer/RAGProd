services:
  server:
    build:
      context: .
    image: ragprod:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: production
      PORT: 8000
      WEB_CONCURRENCY: 1
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
